####################################################################################
### Part 01 — Hostname-Based Routing
###
### Routes traffic to a different backend based on the request Host header:
###   app1.chinmayto.com  -> service-nodejs-app-1 (port 80 -> container 8080)
###   app2.chinmayto.com  -> service-nodejs-app-2 (port 80 -> container 8081)
###
### Namespace: nodejs-app-part1 (isolated from the other parts)
####################################################################################
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nodejs-app-1-httproute
  namespace: nodejs-app-part1
spec:
  parentRefs:
    - name: traefik        # Gateway auto-created by the Traefik Helm chart
      namespace: traefik   # Traefik deploys it into its own namespace
      sectionName: web     # Ties to the named "web" listener (port 80)
  hostnames:
    - "app1.chinmayto.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: service-nodejs-app-1
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nodejs-app-2-httproute
  namespace: nodejs-app-part1
spec:
  parentRefs:
    - name: traefik
      namespace: traefik
      sectionName: web
  hostnames:
    - "app2.chinmayto.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: service-nodejs-app-2
          port: 80
